# InfraRAG defaults -- single source of truth for runtime settings.
# Environment variables INFRARAG_* override matching fields (see config.py).

app:
  name: InfraRAG
  data_dir: data

ollama:
  base_url: http://localhost:11434
  chat_model: qwen2.5:3b
  embed_model: nomic-embed-text
  timeout_s: 120

chroma:
  persist_dir: data/chroma
  collection: infrarag

ingest:
  # Set via UI, .env (INFRARAG_SOURCE_DIR), or override this value.
  source_dir: null
  recursive: true
  follow_symlinks: false
  differential: true
  manifest_path: data/chroma/ingest_manifest.json
  include_extensions:
    - .txt
    - .md
    - .pdf
    - .docx
    - .xlsx
    - .pptx
    - .odt
    - .ods
    - .odp
    - .png
    - .jpg
    - .jpeg
  exclude_dirs:
    - .git
    - node_modules
    - __pycache__
    - .venv
    - venv
  max_file_bytes: 20971520  # 20 MiB
  ocr:
    enabled: true
    lang: es
    use_gpu: false
    min_text_chars: 40
    max_pdf_pages: 50
    skip_photo_folders: true
    photo_folder_image_ratio: 0.6
    photo_folder_min_files: 5

# Character-based chunking (token-aware chunking is a future step).
chunking:
  size: 800
  overlap: 120

rag:
  top_k: 50
  temperature: 0.1
  hybrid_enabled: true
  hybrid_fetch_multiplier: 4
  hybrid_keyword_weight: 0.35

profiles:
  org_dir: profiles/org
  users_root: profiles/users
  user_id: default
  always_include_max_chars: 8000

web:
  enabled: true
  score_threshold: 0.5
  max_results: 5
  fetch_top_n: 2

memory:
  enabled: true
  propose_after_answer: true

attachments:
  max_file_bytes: 20971520
  url_timeout_s: 30
  allowed_url_schemes:
    - http
    - https

ui:
  host: 127.0.0.1
  port: 8501
