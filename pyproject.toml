[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "infrarag"
version = "0.1.0"
description = "Local cross-platform RAG: index a directory, ask questions with Ollama + ChromaDB."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "InfraRAG contributors" }]
dependencies = [
    "streamlit>=1.32",
    "chromadb>=0.5",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "python-pptx>=0.6",
    "odfpy>=1.4",
    "beautifulsoup4>=4.12",
    "duckduckgo-search>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]
ocr = [
    # PaddleOCR 3.x pulls paddlex->pandas<=1.5.3 which does not build on Python 3.12.
    # Stay on the 2.7/2.8 line for local OCR on modern Python.
    "paddlepaddle>=2.6.1,<3.0",
    "paddleocr>=2.7.3,<3",
    "pypdfium2>=4.0",
    "pillow>=10.0",
    "numpy>=1.24",
    "setuptools>=68",
]

[project.scripts]
infrarag = "infrarag.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
